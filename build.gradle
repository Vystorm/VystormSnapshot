plugins { id 'java' }
group = 'at.esoren'
version = '1.22.0'
repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
dependencies {
    compileOnly files(providers.gradleProperty('vystormCoreJar').getOrElse('libs/Vystorm_Core.jar'))
    testImplementation files(providers.gradleProperty('vystormCoreJar').getOrElse('libs/Vystorm_Core.jar'))
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    testImplementation 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.1'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.1'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
def paper1206Libraries = file(providers.gradleProperty('paper1206Libraries').getOrElse((System.getProperty('user.home') + '/source/tools/smoke-1206/libraries')))
tasks.register('compat1206', JavaCompile) {
    description = 'Compiles main sources against the local Paper 1.20.6 libraries with Java 21.'
    group = 'verification'
    source = sourceSets.main.allJava
    classpath = files(providers.gradleProperty('vystormCoreJar').getOrElse('libs/Vystorm_Core.jar')) + fileTree(paper1206Libraries) { include '**/*.jar' }
    destinationDirectory = layout.buildDirectory.dir('classes/java/compat1206')
}
tasks.named('check') { dependsOn 'compat1206' }
tasks.register('compat1206Test', Test) {
    description = 'Runs compatibility selection and menu tests with the Paper 1.20.6 runtime API.'
    group = 'verification'
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.output + sourceSets.main.output + files(providers.gradleProperty('vystormCoreJar').getOrElse('libs/Vystorm_Core.jar')) + fileTree(paper1206Libraries) { include '**/*.jar' } + files(configurations.testRuntimeClasspath.filter {
        it.name.startsWith('junit-') || it.name.startsWith('mockito-') || it.name.startsWith('byte-buddy') || it.name.startsWith('objenesis-') || it.name.startsWith('opentest4j-') || it.name.startsWith('apiguardian-')
    })
    useJUnitPlatform()
    filter { includeTestsMatching '*CompatibilityTest' }
}
tasks.named('check') { dependsOn 'compat1206Test' }
test { useJUnitPlatform() }
processResources { inputs.property('version', project.version); filesMatching('plugin.yml') { expand(version: project.version) } }
jar { archiveFileName = "VystormSnapshot-${project.version}.jar"; from('LICENSE'); from('PROVENANCE.md') }
