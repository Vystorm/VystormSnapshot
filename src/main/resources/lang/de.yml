# /snapshot über Vystorm Core: Beschreibung, Hilfe und Tab-Vervollständigung je Spieler. "aliases" unter commands.snapshot
# sind zusätzliche Hauptbefehle (serverweit, der Admin wählt die Sprachen: Core-Konfig commands.localized-aliases);
# "name" und "aliases" eines Unterbefehls werden in jeder Sprache verstanden, Englisch geht immer.
commands:
  snapshot:
    description: "Kamerafotos: Album, Kameramenü, Galerie und Fotoformat"
    aliases: [schnappschuss]
    sub:
      albums:
        name: albums
        aliases: []
        description: "Private Alben erstellen und gezielt mit Spielern teilen."
        args:
          action: ACTION
      search:
        name: suchen
        aliases: []
        description: "Beschriftungen im eigenen Album suchen"
        args:
          text: TEXT
      album:
        name: album
        aliases: [fotoalbum]
        description: "Dein Fotoalbum öffnen, optional nach Welt gefiltert"
        args:
          world: WELT
      contest:
        name: contest
        aliases: []
        description: "Fotowettbewerb: abstimmen und Foto einreichen"
        sub:
          start:
            name: start
            aliases: []
            description: "Fotowettbewerb starten"
            args:
              hours: HOURS
              theme: THEME
          end:
            name: end
            aliases: []
            description: "Fotowettbewerb jetzt beenden"
      camera:
        name: kamera
        aliases: []
        description: "Filmstil, Format und Rahmen der Kamera in deiner Hand"
      gallery:
        name: galerie
        aliases: []
        description: "Fotos, die alle ausstellen, oder die eines Spielers"
        args:
          player: SPIELER
      format:
        name: format
        aliases: []
        description: "Fotoformat der Kamera in deiner Hand (z. B. 2x1)"
        args:
          format: BxH
      postcard:
        name: postcard
        aliases: []
        description: "Eine Kopie des gehaltenen Fotos mit Gruß verschicken"
        args:
          player: PLAYER
          text: TEXT
      postcards:
        name: postcards
        aliases: []
        description: "Wartende Postkarten abholen"
      caption:
        name: beschriftung
        aliases: []
        description: "Foto in der Hand beschriften; ohne Text wird die Beschriftung entfernt"
        args:
          text: TEXT
      give:
        name: geben
        aliases: []
        description: "Dir oder einem Spieler eine Kamera geben"
        args:
          player: SPIELER
      capture:
        name: aufnehmen
        aliases: []
        description: "Ein Foto von beliebiger Position aufnehmen, z. B. für Spawn-Tafeln"
        args:
          world: WELT
          x: X
          "y": "Y"
          z: Z
          yaw: YAW
          pitch: PITCH
          format: BxH
      reload:
        name: neuladen
        aliases: []
        description: "Konfiguration und Sprachdateien neu laden"

album-title-search: "<gold>Suche: {count} Karten ({page}/{pages})"
capture-unloaded: "<red>Der Kamera-Chunk ist nicht geladen. Besuche den Ort vor einer Konsolenaufnahme."

