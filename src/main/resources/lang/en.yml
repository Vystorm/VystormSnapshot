# /snapshot through Vystorm Core: description, help and tab completion per player. "aliases" under commands.snapshot are
# extra root commands (server-wide, the admin chooses which languages: Core config commands.localized-aliases); "name"
# and "aliases" of a subcommand are accepted in every language, English always works.
commands:
  snapshot:
    description: "Camera photos: album, camera menu, gallery and photo format"
    aliases: []
    sub:
      albums:
        name: albums
        aliases: []
        description: "Create private albums and share them with selected players."
        args:
          action: ACTION
      search:
        name: search
        aliases: []
        description: "Search captions in your own album"
        args:
          text: TEXT
      album:
        name: album
        aliases: []
        description: "Open your photo album, optionally filtered by world"
        args:
          world: WORLD
      contest:
        name: contest
        aliases: []
        description: "Photo contest: vote and enter a photo"
        sub:
          start:
            name: start
            aliases: []
            description: "Start a photo contest"
            args:
              hours: HOURS
              theme: THEME
          end:
            name: end
            aliases: []
            description: "End the photo contest now"
      camera:
        name: camera
        aliases: []
        description: "Film style, format and frame of the camera in your hand"
      gallery:
        name: gallery
        aliases: []
        description: "Photos everyone put on show, or those of one player"
        args:
          player: PLAYER
      format:
        name: format
        aliases: []
        description: "Photo format of the camera in your hand (e.g. 2x1)"
        args:
          format: WxH
      postcard:
        name: postcard
        aliases: []
        description: "Send a copy of the held photo with a greeting"
        args:
          player: PLAYER
          text: TEXT
      postcards:
        name: postcards
        aliases: []
        description: "Collect postcards waiting for you"
      caption:
        name: caption
        aliases: []
        description: "Set a caption for your held photo; omit text to clear it"
        args:
          text: TEXT
      give:
        name: give
        aliases: []
        description: "Give a camera to yourself or a player"
        args:
          player: PLAYER
      capture:
        name: capture
        aliases: []
        description: "Take a photo from any position, e.g. for spawn boards"
        args:
          world: WORLD
          x: X
          "y": "Y"
          z: Z
          yaw: YAW
          pitch: PITCH
          format: WxH
      status:
        name: "status"
        aliases: []
        description: "Block textures and player skins: what photos use right now"
      reload:
        name: reload
        aliases: []
        description: "Reload config and language files"

