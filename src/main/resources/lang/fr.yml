commands:
  snapshot:
    description: 'Photos de l''appareil photo: album, menu de l''appareil photo, galerie et format de photo'
    aliases: []
    sub:
      albums:
        name: albums
        aliases: []
        description: "Créez des albums privés à partager avec certains joueurs."
        args:
          action: ACTION
      search:
        name: search
        aliases: []
        description: Rechercher des légendes dans votre propre album
        args:
          text: TEXT
      album:
        name: album
        aliases: []
        description: Ouvrez votre album photo, éventuellement filtré par le monde
        args:
          world: WORLD
      contest:
        name: contest
        aliases: []
        description: "Concours photo : voter et participer"
        sub:
          start:
            name: start
            aliases: []
            description: "Lancer un concours photo"
            args:
              hours: HOURS
              theme: THEME
          end:
            name: end
            aliases: []
            description: "Terminer le concours maintenant"
      camera:
        name: camera
        aliases: []
        description: Style film, format et cadre de la caméra dans votre main
      gallery:
        name: gallery
        aliases: []
        description: Photos mises en show, ou celles d'un seul joueur
        args:
          player: PLAYER
      format:
        name: format
        aliases: []
        description: Format photo de la caméra dans votre main (e.g. 2x1)
        args:
          format: WxH
      postcard:
        name: postcard
        aliases: []
        description: "Envoyer une copie de la photo tenue avec un mot"
        args:
          player: PLAYER
          text: TEXT
      postcards:
        name: postcards
        aliases: []
        description: "Récupérer les cartes postales en attente"
      caption:
        name: caption
        aliases: []
        description: Définir une légende pour votre photo retenue; omettre du texte pour l'effacer
        args:
          text: TEXT
      give:
        name: give
        aliases: []
        description: Donnez-vous une caméra ou un lecteur
        args:
          player: PLAYER
      capture:
        name: capture
        aliases: []
        description: Prendre une photo de n'importe quelle position, e.g
        args:
          world: WORLD
          x: X
          y: Y
          z: Z
          yaw: YAW
          pitch: PITCH
          format: WxH
      reload:
        name: reload
        aliases: []
        description: Recharger les fichiers de configuration et de langue
album-title-search: '<gold>Recherche: {count} cartes ({page}/{pages})'
capture-unloaded: <red>La caméra n'est pas chargée. Visitez l'emplacement avant de prendre une photo de console.

