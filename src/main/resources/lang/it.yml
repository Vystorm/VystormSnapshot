commands:
  snapshot:
    description: 'Fotocamere: album, menu della fotocamera, galleria e formato foto'
    aliases: []
    sub:
      albums:
        name: albums
        aliases: []
        description: "Crea album privati da condividere con giocatori scelti."
        args:
          action: ACTION
      search:
        name: search
        aliases: []
        description: Cerca le didascalie nel tuo album
        args:
          text: TEXT
      album:
        name: album
        aliases: []
        description: Apri il tuo album fotografico, filtrato facoltativamente dal mondo
        args:
          world: WORLD
      contest:
        name: contest
        aliases: []
        description: "Concorso fotografico: vota e partecipa"
        sub:
          start:
            name: start
            aliases: []
            description: "Avvia un concorso fotografico"
            args:
              hours: HOURS
              theme: THEME
          end:
            name: end
            aliases: []
            description: "Termina subito il concorso"
      camera:
        name: camera
        aliases: []
        description: Stile cinematografico, formato e cornice della fotocamera in mano
      gallery:
        name: gallery
        aliases: []
        description: Foto tutte messe in mostra, o quelle di un giocatore
        args:
          player: PLAYER
      format:
        name: format
        aliases: []
        description: Formato foto della fotocamera in mano (e.g. 2x1)
        args:
          format: WxH
      postcard:
        name: postcard
        aliases: []
        description: "Invia una copia della foto in mano con un saluto"
        args:
          player: PLAYER
          text: TEXT
      postcards:
        name: postcards
        aliases: []
        description: "Ritira le cartoline in attesa"
      caption:
        name: caption
        aliases: []
        description: Impostare una didascalia per la foto tenuta; omettere il testo per cancellarlo
        args:
          text: TEXT
      give:
        name: give
        aliases: []
        description: Dare una fotocamera a te o un giocatore
        args:
          player: PLAYER
      capture:
        name: capture
        aliases: []
        description: Fai una foto da qualsiasi posizione, e.g. per lavagne
        args:
          world: WORLD
          x: X
          y: Sì
          z: Z
          yaw: YAW
          pitch: PITCH
          format: WxH
      status:
        name: "status"
        aliases: []
        description: "Texture dei blocchi e skin dei giocatori: cosa usano ora le foto"
      reload:
        name: reload
        aliases: []
        description: Ricarica file di configurazione e lingua
album-title-search: '<gold>Ricerca: {count} mappe ({page}/{pages})'
capture-unloaded: <red>La cinepresa non è carica. Visita la posizione prima di scattare una foto della console.

