status:
  title: "<gold>Stato di Vystorm Snapshot"
  textures-off: "<gray>Texture dei blocchi: disattivate (block-textures.enabled: false). Le foto usano i colori della mappa."
  textures-missing: "<yellow>Texture dei blocchi: mancanti. Le foto usano colori piatti della mappa. Metti un textures.zip in {path} (assets/minecraft/textures/block, models/block e blockstates da un jar del client Minecraft) ed esegui /snapshot reload. Oppure imposta rendering.vanilla-textures.download: true e rendering.vanilla-textures.accept-download: true perché il plugin le scarichi da Mojang."
  textures-loading: "<gray>Texture dei blocchi: caricamento da {path} ..."
  textures-loaded: "<green>Texture dei blocchi: {count} caricate da {path}."
  textures-failed: "<red>Texture dei blocchi: impossibile usare {path} ({problem}). Restano attive {count} texture."
  skins-off: "<gray>Skin dei giocatori: disattivate (rendering.player-skins: false)."
  skins-on: "<green>Skin dei giocatori: attive, {count} in memoria, nessun errore."
  skins-failure: "<yellow>Skin dei giocatori: attive, {count} in memoria, {waiting} in attesa di un nuovo tentativo. Ultimo errore {ago} fa: {problem}"
  textures-hint: "<yellow>Nota per gli admin: questa foto usa colori piatti della mappa perché mancano le texture dei blocchi. Metti un textures.zip in {path} ed esegui /snapshot reload. /snapshot status mostra lo stato. Oppure lascia che il plugin le scarichi da Mojang: rendering.vanilla-textures.download: true e rendering.vanilla-textures.accept-download: true."
  vanilla-off: "<gray>Download da Mojang: disattivato (rendering.vanilla-textures.download: false)."
  vanilla-consent: "<yellow>Download da Mojang: in attesa del tuo consenso. rendering.vanilla-textures.download: true è impostato; rendering.vanilla-textures.accept-download: true accetta l'EULA di Minecraft (https://www.minecraft.net/eula) e lascia che il plugin scarichi una volta il jar del client."
  vanilla-own-file: "<gray>Download da Mojang: non serve, {path} è un tuo file e non viene mai sostituito."
  vanilla-checking: "<gray>Download da Mojang: controllo della lista versioni di Mojang ..."
  vanilla-downloading: "<gray>Download da Mojang: Minecraft {version}, {percent} % di {size}."
  vanilla-done: "<green>Download da Mojang: fatto, texture di Minecraft {version} del {date}."
  vanilla-failed: "<red>Download da Mojang: non riuscito: {problem}. Nessun altro tentativo fino al prossimo avvio o /snapshot reload."
  vanilla-retrying: "<yellow>Download da Mojang: non riuscito: {problem}. Nuovo tentativo tra {time}."
