menu-photos: <yellow>Fotos por {player}
menu-photos-lore: <gray>{count} fotos na galeria
commands:
  snapshot:
    description: 'Fotos da câmera: álbum, menu da câmera, galeria e formato de foto'
    aliases: []
    sub:
      albums:
        name: albums
        aliases: []
        description: "Crie álbuns privados e compartilhe com jogadores escolhidos."
        args:
          action: ACTION
      search:
        name: search
        aliases: []
        description: Procure legendas em seu próprio álbum
        args:
          text: TEXT
      album:
        name: album
        aliases: []
        description: Abra seu álbum de fotos, opcionalmente filtrado pelo mundo
        args:
          world: WORLD
      contest:
        name: contest
        aliases: []
        description: "Concurso de fotos: votar e participar"
        sub:
          start:
            name: start
            aliases: []
            description: "Iniciar um concurso de fotos"
            args:
              hours: HOURS
              theme: THEME
          end:
            name: end
            aliases: []
            description: "Encerrar o concurso agora"
      camera:
        name: camera
        aliases: []
        description: Estilo, formato e moldura da câmera em sua mão
      gallery:
        name: gallery
        aliases: []
        description: Fotos que todo mundo colocar em show, ou as de um jogador
        args:
          player: PLAYER
      format:
        name: format
        aliases: []
        description: Formato de foto da câmera em sua mão (e.g. 2x1)
        args:
          format: WxH
      postcard:
        name: postcard
        aliases: []
        description: "Enviar uma cópia da foto na mão com uma saudação"
        args:
          player: PLAYER
          text: TEXT
      postcards:
        name: postcards
        aliases: []
        description: "Pegar os cartões-postais esperando por você"
      caption:
        name: caption
        aliases: []
        description: Defina uma legenda para sua foto. Omitir texto para clareá-la
        args:
          text: TEXT
      give:
        name: give
        aliases: []
        description: Dê uma câmera para você ou um jogador
        args:
          player: PLAYER
      capture:
        name: capture
        aliases: []
        description: Tire uma foto de qualquer posição, e.g
        args:
          world: WORLD
          x: X
          y: Y
          z: Z
          yaw: YAW
          pitch: PITCH
          format: WxH
      reload:
        name: reload
        aliases: []
        description: Recarregar arquivos de configuração e linguagem
album-title-search: '<gold>Pesquisa: {count} mapas ({page}/{pages})'
capture-unloaded: <red>O pedaço da câmera não está carregado. Visite o local antes de tirar uma foto do console.

