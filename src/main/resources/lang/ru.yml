commands:
  snapshot:
    description: 'Фотокамеры: альбом, меню камеры, галерея и формат фото'
    aliases: []
    sub:
      albums:
        name: albums
        aliases: []
        description: "Создавайте личные альбомы и делитесь ими с выбранными игроками."
        args:
          action: ACTION
      search:
        name: search
        aliases: []
        description: Поиск подписей в вашем собственном альбоме
        args:
          text: TEXT
      album:
        name: album
        aliases: []
        description: Откройте свой фотоальбом, необязательно отфильтрованный миром
        args:
          world: WORLD
      contest:
        name: contest
        aliases: []
        description: "Фотоконкурс: голосовать и участвовать"
        sub:
          start:
            name: start
            aliases: []
            description: "Начать фотоконкурс"
            args:
              hours: HOURS
              theme: THEME
          end:
            name: end
            aliases: []
            description: "Завершить фотоконкурс сейчас"
      camera:
        name: camera
        aliases: []
        description: Стиль фильма, формат и кадр камеры в руке
      gallery:
        name: gallery
        aliases: []
        description: Фотографии, которые все ставят на шоу, или фотографии одного игрока
        args:
          player: PLAYER
      format:
        name: format
        aliases: []
        description: Формат фотокамеры в руке (e.g). 2x1)
        args:
          format: WxH
      postcard:
        name: postcard
        aliases: []
        description: "Отправить копию фото в руке с приветом"
        args:
          player: PLAYER
          text: TEXT
      postcards:
        name: postcards
        aliases: []
        description: "Забрать ожидающие открытки"
      caption:
        name: caption
        aliases: []
        description: Установите подпись к вашей фотографии; опустите текст, чтобы очистить его
        args:
          text: TEXT
      give:
        name: give
        aliases: []
        description: Дайте камеру себе или игроку
        args:
          player: PLAYER
      capture:
        name: capture
        aliases: []
        description: Сфотографируйтесь с любой позиции, e.g. для нерестовых досок
        args:
          world: WORLD
          x: XX
          y: Y
          z: Z
          yaw: YAW
          pitch: PITCH
          format: WxH
      reload:
        name: reload
        aliases: []
        description: Перезагрузка конфигурационных и языковых файлов
album-title-search: '<gold>Поиск: {count} карт ({page}/{pages})'
capture-unloaded: <red>чанк камеры не загружается. Посетите место, прежде чем сделать консольную фотографию.

