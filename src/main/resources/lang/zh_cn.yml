# 通过 Vystorm Core 提供的 /snapshot：每位玩家看到自己语言的说明、帮助和 Tab 补全。commands.snapshot 下的 "aliases"
# 是额外的主命令（全服生效，由管理员在 Core 配置 commands.localized-aliases 中选择语言）；子命令的 "name" 和
# "aliases" 在所有语言中都可使用，英文始终有效。
commands:
  snapshot:
    description: "相机照片：相册、相机菜单、画廊和照片格式"
    aliases: [相机]
    sub:
      albums:
        name: albums
        aliases: []
        description: "创建私人照片集并分享给指定玩家。"
        args:
          action: ACTION
      search:
        name: 搜索
        aliases: []
        description: "搜索自己相册中的说明"
        args:
          text: TEXT
      album:
        name: 相册
        aliases: []
        description: "打开你的相册，可按世界筛选"
        args:
          world: 世界
      contest:
        name: contest
        aliases: []
        description: "摄影比赛：投票与参赛"
        sub:
          start:
            name: start
            aliases: []
            description: "开始摄影比赛"
            args:
              hours: HOURS
              theme: THEME
          end:
            name: end
            aliases: []
            description: "立即结束摄影比赛"
      camera:
        name: 相机设置
        aliases: []
        description: "手中相机的胶片风格、格式和相框"
      gallery:
        name: 画廊
        aliases: []
        description: "所有人展出的照片，或某位玩家的照片"
        args:
          player: 玩家
      format:
        name: 格式
        aliases: []
        description: "手中相机的照片格式（例如 2x1）"
        args:
          format: 宽x高
      postcard:
        name: postcard
        aliases: []
        description: "将手中照片的副本附上问候寄出"
        args:
          player: PLAYER
          text: TEXT
      postcards:
        name: postcards
        aliases: []
        description: "领取等待中的明信片"
      caption:
        name: 说明
        aliases: []
        description: "为手持照片设置说明；省略文字即可清除"
        args:
          text: 文字
      give:
        name: 给予
        aliases: []
        description: "给自己或一名玩家一台相机"
        args:
          player: 玩家
      capture:
        name: 拍摄
        aliases: []
        description: "从任意位置拍摄照片，例如用于出生点展板"
        args:
          world: 世界
          x: X
          "y": "Y"
          z: Z
          yaw: YAW
          pitch: PITCH
          format: 宽x高
      status:
        name: "状态"
        aliases: []
        description: "方块材质和玩家皮肤：照片当前使用的内容"
      reload:
        name: 重载
        aliases: []
        description: "重新加载配置和语言文件"

album-title-search: "<gold>搜索：{count} 张地图（{page}/{pages}）"
capture-unloaded: "<red>相机所在区块尚未加载。请先前往该位置，再从控制台拍照。"

